<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#141829" />
      <stop offset="50%" stopColor="#0d0f1a" />
      <stop offset="100%" stopColor="#07080e" />
    </linearGradient>
    <linearGradient id="fl-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="60%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#10b981" />
    </linearGradient>
    <linearGradient id="fl-core" x1="20%" y1="20%" x2="90%" y2="90%">
      <stop offset="0%" stopColor="#fbbf24" />
      <stop offset="45%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <filter id="fl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#fl-bg)" stroke="url(#fl-border)" stroke-width="3.5" />

  <!-- Micro Grid Circuit Lines -->
  <line x1="22" y1="50" x2="78" y2="50" stroke="#1c2238" stroke-width="1" stroke-dasharray="2,3" />
  <line x1="50" y1="22" x2="50" y2="78" stroke="#1c2238" stroke-width="1" stroke-dasharray="2,3" />

  <!-- Interlocking FL Logic Circuit Lines -->
  <path d="M 32 26 L 32 74" stroke="url(#fl-core)" stroke-width="7" stroke-linecap="round" />
  <path d="M 32 28 L 68 28" stroke="url(#fl-core)" stroke-width="7" stroke-linecap="round" />
  <path d="M 32 48 L 56 48" stroke="url(#fl-core)" stroke-width="6.5" stroke-linecap="round" />
  <path d="M 32 72 L 72 72" stroke="url(#fl-core)" stroke-width="7" stroke-linecap="round" />

  <!-- Glowing Neural & Database Logic Terminal Nodes -->
  <circle cx="68" cy="28" r="4.5" fill="#fde68a" filter="url(#fl-glow)" />
  <circle cx="68" cy="28" r="2.5" fill="#ffffff" />

  <circle cx="56" cy="48" r="4" fill="#fbbf24" filter="url(#fl-glow)" />
  <circle cx="56" cy="48" r="2" fill="#ffffff" />

  <circle cx="72" cy="72" r="4.5" fill="#38bdf8" filter="url(#fl-glow)" />
  <circle cx="72" cy="72" r="2.5" fill="#ffffff" />

  <circle cx="32" cy="28" r="3" fill="#fbbf24" />
</svg>
